<script>window.QUIZ=[{"u": 1, "t": "重要性", "q": "以下哪一項「不是」簡報提及的家庭對個人成長的重要性？", "zh": "importance", "o": ["提供工作機會", "提供成長環境", "給予情感支援", "培養良好品格"], "a": 0, "e": "三項：成長環境、情感支援、品格教育。"}, {"u": 1, "t": "重要性", "q": "「家庭提供生活所需，營造安全和穩定的環境」屬於哪一項？", "zh": "environment", "o": ["提供成長環境", "給予情感支援", "培養良好品格", "促進彼此進步"], "a": 0, "e": "例如媽媽給零用錢和學費。"}, {"u": 1, "t": "重要性", "q": "成績退步時，姐姐說「不懂功課就問我吧」，屬於家庭的哪項功能？", "zh": "support", "o": ["給予情感支援", "提供成長環境", "培養良好品格", "尋求第三方協助"], "a": 0, "e": "家人的關懷有助紓緩情緒。"}, {"u": 1, "t": "重要性", "q": "兒童從家庭中學到生活知識、技能和價值觀，屬於…", "zh": "character", "o": ["培養良好品格", "提供成長環境", "給予情感支援", "期望落差"], "a": 0, "e": "例：提醒孩子禮貌地問好。"}, {"u": 1, "t": "理論", "q": "簡報用哪個理論說明家庭對個人成長的重要？", "zh": "theory", "o": ["馬斯洛「需求層次理論」", "社會滲透理論", "關係階段理論", "非暴力溝通"], "a": 0, "e": "馬斯洛 Maslow。"}, {"u": 1, "t": "衝突", "q": "缺乏聆聽或用不當的溝通方式引起誤解，屬於哪一種衝突原因？", "zh": "cause", "o": ["溝通失效", "管教矛盾", "親子代溝", "競爭心態"], "a": 0, "e": "五個原因之一。"}, {"u": 1, "t": "衝突", "q": "子女自主意識提升，與父母的管教和指導出現分歧，屬於…", "zh": "cause", "o": ["管教矛盾", "期望落差", "溝通失效", "親子代溝"], "a": 0, "e": "例：父母怪子女打機。"}, {"u": 1, "t": "衝突", "q": "父母和子女成長年代不同，想法和價值觀不一致，屬於…", "zh": "cause", "o": ["親子代溝", "管教矛盾", "競爭心態", "期望落差"], "a": 0, "e": "對同一事件有不同看法。"}, {"u": 1, "t": "衝突", "q": "父母希望子女將來做專業行業，子女卻想以興趣優先，屬於…", "zh": "cause", "o": ["期望落差", "親子代溝", "溝通失效", "競爭心態"], "a": 0, "e": "家人之間對彼此的期望不同。"}, {"u": 1, "t": "衝突", "q": "父母常將兄弟姊妹互相比較，可能引起…", "zh": "cause", "o": ["競爭心態", "期望落差", "管教矛盾", "溝通失效"], "a": 0, "e": "父母應給予子女合宜公平的對待。"}, {"u": 1, "t": "數據", "q": "根據調查，以下哪一項「不是」親子衝突首三位的原因？", "zh": "survey", "o": ["分擔家務", "玩手機或打機", "入睡時間", "學業"], "a": 0, "e": "分擔家務引起衝突的比率最低。"}, {"u": 2, "t": "處理", "q": "藉討論達致共識的正確步驟是？", "zh": "steps", "o": ["分析起因 → 討論分享 → 付諸實行", "付諸實行 → 分析起因 → 討論分享", "討論分享 → 付諸實行 → 分析起因", "責備對方 → 分析起因 → 付諸實行"], "a": 0, "e": "先確認雙方承認衝突、願意和解、期望共同解決。"}, {"u": 2, "t": "處理", "q": "甚麼時候需要尋求第三方協助？", "zh": "third party", "o": ["雙方不能達成共識時", "一開始吵架時", "想贏對方時", "不想再見對方時"], "a": 0, "e": "第三方可以是身邊人或專業人士。"}, {"u": 2, "t": "處理", "q": "第三方要具備甚麼條件？", "zh": "qualities", "o": ["公正、雙方共同信任、有能力化解衝突", "只支持子女", "只支持父母", "越多人越好"], "a": 0, "e": "例如老師、社工、親友。"}, {"u": 2, "t": "個案", "q": "偉文與父母衝突，父母認為他應該…", "zh": "case", "o": ["專注學業", "成為職業網球員", "多玩手機", "轉校"], "a": 0, "e": "偉文希望父母支持他成為職業網球員。"}, {"u": 2, "t": "個案", "q": "心淇拒絕母親在社交媒體上的「交友邀請」，因為她認為…", "zh": "case", "o": ["自己有私隱權", "母親不懂用手機", "母親太忙", "她沒有社交媒體"], "a": 0, "e": "母親則因關心女兒的安全而想看。"}, {"u": 2, "t": "個案", "q": "以下哪一項是協助心淇化解衝突的合適建議？", "zh": "suggestion", "o": ["心淇多跟母親分享社交活動，母親不加入她的社交媒體", "心淇刪除所有朋友", "母親偷看心淇的手機", "心淇不再和母親說話"], "a": 0, "e": "讓母親多了解自己，母親以示尊重和信任。"}, {"u": 2, "t": "影響", "q": "家庭衝突的正面影響是？", "zh": "positive", "o": ["更了解家人想法，增進溝通，避免同類衝突", "家人互相傷害", "破壞家庭關係", "大家不再說話"], "a": 0, "e": "負面影響：因憤怒出言傷害對方。"}, {"u": 2, "t": "影響", "q": "家庭衝突的負面影響是？", "zh": "negative", "o": ["因憤怒出言傷害對方，破壞家庭關係", "增進彼此溝通", "更了解家人", "避免同類衝突"], "a": 0, "e": "衝突同時有正面影響。"}, {"u": 2, "t": "答題", "q": "回答「衝突原因」的題目時，應該寫出…", "zh": "exam tip", "o": ["子女的看法和父母的看法", "只寫自己的看法", "只寫父母的看法", "只寫結果"], "a": 0, "e": "雙方的看法都要寫。"}, {"u": 3, "t": "溝通", "q": "有效溝通的「非語言運用」包括…", "zh": "non-verbal", "o": ["配合表情、聲線、姿勢，利用眼神接觸、點頭", "大聲責備", "避免看對方", "不停說話"], "a": 0, "e": "三方面：語言運用、非語言運用、態度。"}, {"u": 3, "t": "溝通", "q": "以下哪一項是良好溝通的「態度」？", "zh": "attitude", "o": ["誠懇，運用同理心", "強迫對方順從自己", "用抱怨的詞彙", "打斷對方說話"], "a": 0, "e": "不強迫對方順從自己的想法。"}, {"u": 3, "t": "形態", "q": "美國溝通理論權威薩提爾提出多少種溝通形態？", "zh": "Satir", "o": ["五種", "三種", "四種", "六種"], "a": 0, "e": "討好、責備、理智、打岔、一致。"}, {"u": 3, "t": "形態", "q": "理想的溝通形態是哪一型？", "zh": "ideal", "o": ["一致型", "討好型", "理智型", "打岔型"], "a": 0, "e": "坦率表達自己，顧及自己和他人感受。"}, {"u": 3, "t": "形態", "q": "「努力取悅對方，忽略自己感受」是哪一型？", "zh": "placating", "o": ["討好型", "責備型", "一致型", "理智型"], "a": 0, "e": "或會被他人操控。"}, {"u": 3, "t": "形態", "q": "「多批評和責備他人，只顧個人感受」是哪一型？", "zh": "blaming", "o": ["責備型", "討好型", "打岔型", "一致型"], "a": 0, "e": "控制欲強，難建立親密關係。"}, {"u": 3, "t": "形態", "q": "「甚少流露情感，予人嚴謹、沉悶印象」是哪一型？", "zh": "super-reasonable", "o": ["理智型", "一致型", "討好型", "責備型"], "a": 0, "e": "感覺不易接近。"}, {"u": 3, "t": "形態", "q": "「時常轉移焦點，對身邊人和事毫不在意」是哪一型？", "zh": "irrelevant", "o": ["打岔型", "理智型", "一致型", "責備型"], "a": 0, "e": "打岔＝轉移話題。"}, {"u": 3, "t": "非暴力溝通", "q": "非暴力溝通四個要素的正確次序是？", "zh": "NVC", "o": ["觀察 → 感受 → 需要 → 請求", "感受 → 觀察 → 請求 → 需要", "請求 → 需要 → 感受 → 觀察", "觀察 → 請求 → 感受 → 需要"], "a": 0, "e": "由美國心理學家馬歇爾・盧森堡始創。"}, {"u": 3, "t": "非暴力溝通", "q": "志彥說「我感到生氣」，屬於非暴力溝通的哪一個要素？", "zh": "feeling", "o": ["感受", "觀察", "需要", "請求"], "a": 0, "e": "純粹描述感受的字詞。"}, {"u": 3, "t": "非暴力溝通", "q": "「希望家人下次吃我的雪糕時，能先問問我的意願」屬於…", "zh": "request", "o": ["請求", "觀察", "感受", "需要"], "a": 0, "e": "請求要具體清楚、即時可做。"}, {"u": 3, "t": "非暴力溝通", "q": "志彥的「憤怒」提醒他甚麼需要得不到滿足？", "zh": "need", "o": ["尊重", "金錢", "休息", "食物"], "a": 0, "e": "我希望獲家人尊重，因為雪糕是我買的。"}, {"u": 3, "t": "責任", "q": "以下哪一項「不是」簡報中青少年承擔家庭責任的例子？", "zh": "responsibility", "o": ["替家人做所有決定", "照顧自己", "分擔家務", "分享所學"], "a": 0, "e": "四個例子：照顧自己、照顧家人、分擔家務、分享所學。"}, {"u": 3, "t": "活動", "q": "恆常安排家庭活動的目的是？", "zh": "family activities", "o": ["培養共同興趣和增加話題", "減少見面", "比較誰最厲害", "減少家務"], "a": 0, "e": "成效：增進感情、提升家庭凝聚力。"}, {"u": 3, "t": "個案", "q": "佩瑩的母親為甚麼苦惱？", "zh": "case", "o": ["想進修和重投職場，但擔心未能照顧好家人", "佩瑩成績退步", "父親不回家", "家中沒有錢"], "a": 0, "e": "母親是家庭主婦，難以兼顧進修和家庭。"}];</script>
