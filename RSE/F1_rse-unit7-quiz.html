<script>window.QUIZ=[{"u": 1, "t": "偶像", "q": "把受造物視為天主般看待和尊敬，稱為？", "zh": "idolatry", "o": ["崇拜偶像", "祈禱", "信德", "感恩"], "a": 0, "e": "例如把金錢、權力當作生命的中心。"}, {"u": 1, "t": "偶像", "q": "以下哪一項可以成為被崇拜的「受造物」？", "zh": "idol", "o": ["金錢", "天主", "聖神", "耶穌"], "a": 0, "e": "金錢、權力、國家領導等。"}, {"u": 1, "t": "十誡", "q": "崇拜偶像違反了十誡中的哪一誡？", "zh": "commandment", "o": ["第一誡", "第三誡", "第五誡", "第十誡"], "a": 0, "e": "改正題：不是第三誡。"}, {"u": 1, "t": "十誡", "q": "十誡第一誡是？", "zh": "1st commandment", "o": ["欽崇一天主在萬有之上", "孝敬父母", "不可殺人", "守瞻禮主日"], "a": 0, "e": "即「不可有別的神」。"}, {"u": 1, "t": "十誡", "q": "「孝敬父母」是十誡中的第幾誡？", "zh": "4th", "o": ["第四誡", "第一誡", "第五誡", "第七誡"], "a": 0, "e": "第五誡是不可殺人。"}, {"u": 1, "t": "十誡", "q": "「不可偷盜」是十誡中的第幾誡？", "zh": "7th", "o": ["第七誡", "第六誡", "第八誡", "第十誡"], "a": 0, "e": "第八誡是不可作假見證。"}, {"u": 1, "t": "出谷紀", "q": "天主召叫梅瑟，引領以色列子民經過紅海，離開…", "zh": "Exodus", "o": ["埃及", "哈蘭", "客納罕", "羅馬"], "a": 0, "e": "改正題：不是哈蘭。"}, {"u": 1, "t": "出谷紀", "q": "以色列子民在曠野中，天主降下甚麼作食糧？", "zh": "manna", "o": ["瑪納", "五餅二魚", "葡萄", "金牛"], "a": 0, "e": "這是天主照顧子民的例子。"}, {"u": 1, "t": "金牛像", "q": "以色列子民鑄造金牛像，因為他們認為金牛像能…", "zh": "golden calf", "o": ["代替天主，為他們領路和保護他們", "變成金錢", "帶他們回埃及", "讓梅瑟回來"], "a": 0, "e": "他們把金牛像看作帶領他們離開埃及的神。"}, {"u": 1, "t": "金牛像", "q": "梅瑟獨自留在山上時，以色列子民的心情是？", "zh": "feelings", "o": ["擔憂、惶恐", "非常興奮", "完全不在乎", "十分驕傲"], "a": 0, "e": "怕梅瑟遭遇不測而失去領袖。"}, {"u": 2, "t": "迷信", "q": "「迷信」是指___地相信某種行為、儀式或物品具有神奇效力。", "zh": "superstition", "o": ["非理性", "用邏輯", "科學", "有證據"], "a": 0, "e": "改正題：不是「用邏輯」。"}, {"u": 2, "t": "迷信", "q": "以下哪一項「不是」人產生迷信的原因？", "zh": "causes", "o": ["努力讀書", "貪念", "不勞而獲的心態", "對將來的恐懼"], "a": 0, "e": "迷信源於貪念、不勞而獲、對將來的恐懼。"}, {"u": 2, "t": "迷信", "q": "迷信會令人…", "zh": "effects", "o": ["焦慮不安，忘記責任，不善用能力", "更加努力", "更有信德", "更健康"], "a": 0, "e": "處處依賴它、受它牽制。"}, {"u": 2, "t": "個案", "q": "中學生認為十字架有驅邪治鬼的力量，放在房間保護自己。這是…", "zh": "case 1", "o": ["屬於迷信", "不屬於迷信", "一種信德", "一種科學"], "a": 0, "e": "非理性地相信十字架有神奇效力。"}, {"u": 2, "t": "個案", "q": "一家人按傳統拜祭祖先，祈求亡者得到安息。這是…", "zh": "case 2", "o": ["不屬於迷信", "屬於迷信", "崇拜偶像", "
