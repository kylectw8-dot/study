<script>window.QUIZ=[{"u": 1, "t": "困苦", "q": "以下哪一項「不是」工作紙提及的面對困苦的回應？", "zh": "responses", "o": ["責怪天主", "逃避它", "克服它", "改變自己的態度"], "a": 0, "e": "有些人逃避、有些克服、有些改變態度。"}, {"u": 1, "t": "門徒", "q": "耶穌被捕時，門徒的反應是？", "zh": "disciples", "o": ["膽怯得逃跑了", "勇敢地救祂", "去找羅馬軍隊", "在聖殿唱歌"], "a": 0, "e": "耶穌死後，有些失望離開，有些害怕躲藏。"}, {"u": 1, "t": "門徒", "q": "耶穌死後，門徒感到十分…", "zh": "feelings", "o": ["懼怕及失望", "高興及興奮", "驕傲", "輕鬆"], "a": 0, "e": "後來因信仰帶來的希望重獲力量。"}, {"u": 1, "t": "逾越", "q": "「逾越」的意思是？", "zh": "Passover", "o": ["超過、越過", "後退", "停止", "忘記"], "a": 0, "e": "耶穌的逾越 = 從死者中復活。"}, {"u": 1, "t": "希望", "q": "希望是一種力量，鼓勵人___面前的限制，走向美善。", "zh": "hope", "o": ["突破", "接受", "害怕", "避開"], "a": 0, "e": "希望可指美好的願望或理想。"}, {"u": 1, "t": "希望", "q": "人若存有希望及心中懷有___，便有力量跨越困難與痛苦。", "zh": "love", "o": ["愛", "恨", "錢", "怒"], "a": 0, "e": "工作紙甲部 Q9。"}, {"u": 1, "t": "接納", "q": "因著耶穌的愛，基督徒能接納自己的___，跨越自己的有限。", "zh": "accept", "o": ["不足", "成績", "財富", "名氣"], "a": 0, "e": "甚至有力量面對死亡的恐懼。"}, {"u": 2, "t": "復活節", "q": "天主教會在復活節慶祝甚麼？", "zh": "Easter", "o": ["耶穌從死者中復活", "耶穌誕生", "聖人", "亡者"], "a": 0, "e": "慶祝耶穌的逾越。"}, {"u": 2, "t": "復活", "q": "「復活」是指整個人…", "zh": "resurrection", "o": ["進入一個新而永恆的生命", "回復昔日的生命", "變成天使", "睡了很久"], "a": 0, "e": "復活的人不會再面對死亡。"}, {"u": 2, "t": "復生", "q": "「復生」是指…", "zh": "revival", "o": ["回復昔日的生命", "進入永恆的生命", "永遠不會死", "升上天堂"], "a": 0, "e": "復活並不同復生。"}, {"u": 2, "t": "復活", "q": "復活的人還會再面對甚麼？", "zh": "death", "o": ["不會再面對死亡", "會再死一次", "會變老", "會生病"], "a": 0, "e": "進入新而永恆的生命。"}, {"u": 2, "t": "顯現", "q": "耶穌復活後首先向誰顯現？", "zh": "appearance", "o": ["婦女", "羅馬皇帝", "大司祭", "賢士"], "a": 0, "e": "然後再向門徒顯現，祝福他們平安。"}, {"u": 2, "t": "顯現", "q": "耶穌向門徒顯現時祝福他們…", "zh": "peace", "o": ["平安", "富有", "長壽", "勝利"], "a": 0, "e": "使門徒體會耶穌的愛及接納。"}, {"u": 2, "t": "證據", "q": "以下哪一項是耶穌讓門徒相信祂已復活的方法？", "zh": "proof", "o": ["展示自己的傷痕", "寫信給門徒", "派天使去說", "在報紙刊登"], "a": 0, "e": "還有與門徒對話、一起吃魚。"}, {"u": 2, "t": "證據", "q": "耶穌與門徒一起吃甚麼，讓他們相信祂已復活？", "zh": "fish", "o": ["魚", "麵包和酒", "羔羊", "瑪納"], "a": 0, "e": "與門徒對話、展示傷痕、一起吃魚。"}, {"u": 2, "t": "
