<script>window.QUIZ=[{"u": 1, "t": "名稱", "q": "「Bible」源自希臘文 Biblios，意思是？", "zh": "The Book", "o": ["那本書", "神聖的話", "好消息", "盟約"], "a": 0, "e": "Biblios = The Book，即「那本書」。"}, {"u": 1, "t": "作者", "q": "天主教會認為聖經的主要作者是？", "zh": "author", "o": ["天主", "梅瑟", "耶穌的門徒", "教宗"], "a": 0, "e": "聖經記載天主的說話及祂與人交往的救恩歷史。"}, {"u": 1, "t": "作者", "q": "「天主揀選了世上的一些人，默感他們撰寫及編輯各書卷」說明聖經是…", "zh": "human book", "o": ["人的書", "天主的書", "教會的書", "歷史的書"], "a": 0, "e": "是由人寫成的，所以是「人的書」。"}, {"u": 1, "t": "作者", "q": "「天父與他的子女談話，所以聖經又稱為聖言」說明聖經是…", "zh": "God's book", "o": ["天主的書", "人的書", "教會的書", "先知的書"], "a": 0, "e": "聖經是天主的說話。"}, {"u": 1, "t": "作者", "q": "「在聖神推動下，教會辨認哪些著作應包括在聖經裡」說明聖經是…", "zh": "Church's book", "o": ["教會的書", "人的書", "天主的書", "智慧的書"], "a": 0, "e": "由教會辨認及確認。"}, {"u": 1, "t": "默感", "q": "「默感」是指天主藉著人，以人的___把自己的說話記錄下來。", "zh": "inspiration", "o": ["言語", "圖畫", "夢境", "法律"], "a": 0, "e": "天主的能力啟發及推動作者寫出救恩真理。"}, {"u": 1, "t": "形成", "q": "聖經形成過程中，在信仰團體中廣泛傳誦的階段稱為？", "zh": "oral tradition", "o": ["口傳", "默感", "編輯", "確認"], "a": 0, "e": "先口傳，後寫成文字。"}, {"u": 1, "t": "形成", "q": "聖經形成的最後一步是？", "zh": "last step", "o": ["由教會辨別及確認", "寫成文字資料", "在團體中口傳", "耶穌的生活事件"], "a": 0, "e": "編輯成書卷後，由教會辨別及確認。"}, {"u": 2, "t": "盟約", "q": "舊約和新約的分界線是？", "zh": "dividing line", "o": ["耶穌降生", "梅瑟出生", "耶穌復活", "教會成立"], "a": 0, "e": "以耶穌降生的事蹟為分界。"}, {"u": 2, "t": "盟約", "q": "舊約的盟約是在哪裡訂立的？", "zh": "Old Covenant", "o": ["西乃山", "十字架", "白冷", "耶路撒冷聖殿"], "a": 0, "e": "天主在西乃山藉梅瑟與以色列民族立約。"}, {"u": 2, "t": "盟約", "q": "舊約時，天主藉著誰與以色列民族訂立盟約？", "zh": "Moses", "o": ["梅瑟", "耶穌", "亞巴郎", "達味"], "a": 0, "e": "西乃山上，藉著梅瑟。"}, {"u": 2, "t": "盟約", "q": "新約的盟約，天主是與誰訂立的？", "zh": "New Covenant", "o": ["全人類", "以色列民族", "羅馬人", "只有門徒"], "a": 0, "e": "在十字架上，藉著耶穌，與全人類訂立新盟約。"}, {"u": 2, "t": "盟約", "q": "聖經總稱為「約」，因為中心思想是天主願意與人…", "zh": "covenant", "o": ["建立關係，訂立盟約", "比賽力量", "交換禮物", "分開生活"], "a": 0, "e": "天主願意與人建立關係。"}, {"u": 2, "t": "福音", "q": "「福音」的意思是？", "zh": "Gospel", "o": ["喜訊、好消息", "法律", "歷史", "預言"], "a": 0, "e": "天主藉耶穌在人間建立天國，帶來永遠的救恩。"}, {"u": 2, "t": "愛不止息",
