<script>window.QUIZ=[{"u": 1, "t": "描寫", "q": "描寫人物的外貌和衣着，屬於…", "zh": "描寫方法", "o": ["肖像描寫", "語言描寫", "行動描寫", "心理描寫"], "a": 0, "e": "例如眼睛、衣服。"}, {"u": 1, "t": "描寫", "q": "「心裏想道：好在王大夫同汪大夫也差不多」屬於…", "zh": "描寫方法", "o": ["心理描寫", "肖像描寫", "行動描寫", "語言描寫"], "a": 0, "e": "寫人物心裏想的。"}, {"u": 1, "t": "描寫", "q": "寫人物說的話，屬於…", "zh": "描寫方法", "o": ["語言描寫", "心理描寫", "肖像描寫", "景物描寫"], "a": 0, "e": "例如「不是差不多嗎？」"}, {"u": 2, "t": "差不多", "q": "作者說差不多先生是「中國全國人的代表」，暗示…", "zh": "暗示", "o": ["這種習性隨處可見", "他受國人推崇", "他聲名遠播", "他樣子普通"], "a": 0, "e": "答案 D。"}, {"u": 2, "t": "差不多", "q": "五件事按甚麼順序鋪排？", "zh": "鋪排", "o": ["由輕微到嚴重", "由嚴重到輕微", "由成功到失敗", "隨意排列"], "a": 0, "e": "最後他因治病而死。"}, {"u": 2, "t": "差不多", "q": "差不多先生記賬時把哪兩個字混淆？", "zh": "記賬", "o": ["千字和十字", "百字和千字", "一字和二字", "萬字和千字"], "a": 0, "e": "「千字比十字只多一小撇」。"}, {"u": 2, "t": "差不多", "q": "差不多先生生病時請了誰醫治？", "zh": "治病", "o": ["牛醫王大夫", "汪大夫", "藤野先生", "岳飛"], "a": 0, "e": "他認為王大夫同汪大夫差不多。"}, {"u": 2, "t": "差不多", "q": "為甚麼作者只略寫差不多先生的外貌？", "zh": "略寫", "o": ["突顯他是普通中國人的寫照", "作者不知道他的樣子", "他長得很醜", "篇幅不夠"], "a": 0, "e": "他的相貌和大家差不多。"}, {"u": 2, "t": "差不多", "q": "「圓通大師」這個稱號用了甚麼手法？", "zh": "手法", "o": ["諷刺", "比喻", "排比", "誇張"], "a": 0, "e": "表面稱讚，實際批評他馬虎。"}, {"u": 2, "t": "差不多", "q": "本文主要批評甚麼態度？", "zh": "主旨", "o": ["做事馬虎、不認真", "太過認真", "太愛讀書", "不肯吃虧"], "a": 0, "e": "馬虎態度是社會的病。"}, {"u": 3, "t": "岳飛", "q": "岳飛的名字「飛」從何而來？", "zh": "名字", "o": ["出生時有大鳥飛鳴屋上", "他跑得很快", "父親喜歡鳥", "他會飛"], "a": 0, "e": "「有大禽若鵠，飛鳴室上，因以為名」。"}, {"u": 3, "t": "岳飛", "q": "岳飛出生和未滿月時的兩件事暗示了甚麼？", "zh": "暗示", "o": ["他是不平凡的人", "他身體虛弱", "他家很富有", "他不喜歡水"], "a": 0, "e": "出生異象和幼年遇險不死。"}, {"u": 3, "t": "岳飛", "q": "「拾薪為燭，誦習達旦」反映岳飛…", "zh": "學習態度", "o": ["學習認真努力", "家裏很富有", "不喜歡讀書", "愛玩火"], "a": 0, "e": "因家貧，拾柴枝作蠟燭照明讀書。"}, {"u": 3, "t": "岳飛", "q": "岳飛在周同死後朔望到墓前拜祭，反映他…", "zh": "品德", "o": ["知恩圖報、尊師重道", "想得到弓", "喜歡喝酒", "不聽父親話"], "a": 0, "e": "他對周同的離世十分悲痛。"}, {"u": 3, "t": "岳飛", "q": "「朔望」的意思是？", "zh": "字詞", "o": ["初一和十五", "早上和晚上", "春天和秋天", "月亮"], "a": 0, "e": "每月初一、十五拜祭。"}, {"u": 3, "t": "岳飛", "q": "「惟大人許兒以身報國家」反映岳飛的甚
