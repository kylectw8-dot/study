<div class="wrap">
<section id="start">

  <h1>中文 單元三小測 ✍️</h1>
  <p class="sub">親情可貴（抒情）。慢慢做，沒有時間限制。</p>
  <div class="card">

    <div class="choose"><button class="big u1" data-set="1">抒情方法<small>直接與間接</small></button><button class="big u2" data-set="2">背影<small>朱自清、壽大姊五十序</small></button><button class="big" data-set="all">全部題目<small>共 14 題</small></button></div>

  </div>
</section>
<section id="quiz" class="hidden">
  <div class="top"><span id="count">第 1 題，共 10 題</span><span id="pts">⭐ 0</span></div>

    <p class="qtext" id="qtext"></p>

    <div id="fb" class="fb hidden" role="status" aria-live="polite"></div>
    <div class="row"><button class="btn hidden" id="nextBtn" type="button">下一題</button></div>
  </div>
</section>
<section id="end" class="hidden">
  <h1>做完了，好叻！🎉</h1>
  <div class="card">
    <div class="stars" id="stars"></div>
    <div class="score" id="final"></div>
    <p id="msg"></p>
    <div id="reviewBox"></div>
    <div class="row">
      <button class="btn" id="retryWrong" type="button">再做答錯的題目</button>
      <button class="btn alt" id="again" type="button">重新開始</button>
      <button class="btn alt" id="home" type="button">選擇其他範圍</button>
    </div>
  </div>
</section>
</div>
