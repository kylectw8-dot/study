<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maths Chapter 6 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="is-quiz.css">
</head>
<body>
<div class="wrap">
<section id="start">
  <p style="margin:0"><a href="./" style="color:inherit">← Maths</a> · <a href="F1_maths-unit6-study-guide.html" style="color:inherit">📘 Study guide</a></p>
  <h1>Maths Chapter 6 Quiz ➗</h1>
  <p class="sub">Manipulations of Polynomials. Take your time. There is no timer.</p>
  <div class="card">
    <b>Choose a quiz</b>
    <div class="choose"><button class="big u1" data-set="1">Polynomials<small>Terms, degree, order, value</small></button><button class="big u2" data-set="2">Add &amp; subtract<small>Like terms and brackets</small></button><button class="big u3" data-set="3">Expansion<small>Single and double brackets</small></button><button class="big" data-set="all">Everything<small>All 20 questions</small></button></div>
    <label class="toggle"><input type="checkbox" id="zhToggle" checked> Show Chinese help words 中文提示</label>
    <label class="toggle"><input type="checkbox" id="autoRead"> Read each question aloud 🔊</label>
  </div>
</section>
<section id="quiz" class="hidden">
  <div class="top"><span id="count">Question 1 of 10</span><span id="pts">⭐ 0</span></div>
  <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
  <div class="card">
    <span class="tag" id="topic"></span>
    <p class="qtext" id="qtext"></p>
    <p class="zh" id="qzh"></p>
    <button class="btn alt speak" id="speakBtn" type="button">🔊 Read aloud</button>
    <div class="opts" id="opts" role="group" aria-label="Answer choices"></div>
    <div id="fb" class="fb hidden" role="status" aria-live="polite"></div>
    <div class="row"><button class="btn hidden" id="nextBtn" type="button">Next question</button></div>
  </div>
</section>
<section id="end" class="hidden">
  <h1>Well done for finishing! 🎉</h1>
  <div class="card">
    <div class="stars" id="stars"></div>
    <div class="score" id="final"></div>
    <p id="msg"></p>
    <div id="reviewBox"></div>
    <div class="row">
      <button class="btn" id="retryWrong" type="button">Try my wrong ones again</button>
      <button class="btn alt" id="again" type="button">Start again</button>
      <button class="btn alt" id="home" type="button">Choose another quiz</button>
    </div>
  </div>
</section>
</div>
<script>window.QUIZ=[{"u": 1, "t": "Polynomials", "q": "Which is NOT a polynomial?", "zh": "多項式", "o": ["4/y⁵", "10", "2a²b", "3x/4"], "a": 0, "e": "A letter in the denominator is not allowed."}, {"u": 1, "t": "Polynomials", "q": "The degree of 0.3pq³ is…", "zh": "次數", "o": ["4", "3", "0.3", "1"], "a": 0, "e": "1 + 3 = 4."}, {"u": 1, "t": "Polynomials", "q": "The coefficient of 0.3pq³ is…", "zh": "係數", "o": ["0.3", "3", "4", "pq³"], "a": 0, "e": "The number in front."}, {"u": 1, "t": "Polynomials", "q": "The degree of −3m²n + 5mn⁴ − 1 is…", "zh": "次數", "o": ["5", "3", "4", "6"], "a": 0, "e": "mn⁴ has degree 1 + 4."}, {"u": 1, "t": "Polynomials", "q": "How many terms does 4r² − 3 have?", "zh": "項數", "o": ["2", "1", "3", "4"], "a": 0, "e": "4r² and −3."}, {"u": 1, "t": "Polynomials", "q": "3x³ + 6 − 2x⁴ − x in ascending powers of x is…", "zh": "升冪", "o": ["6 − x + 3x³ − 2x⁴", "−2x⁴ + 3x³ − x + 6", "6 + x + 3x³ + 2x⁴", "x − 6 − 3x³ + 2x⁴"], "a": 0, "e": "Smallest power first."}, {"u": 1, "t": "Polynomials", "q": "Value of 10 + 4x³ + 5x⁵ − 3x² + 2x when x = 1?", "zh": "代入", "o": ["18", "24", "−4", "14"], "a": 0, "e": "10 + 4 + 5 − 3 + 2."}, {"u": 1, "t": "Polynomials", "q": "Value of 10 + 4x³ + 5x⁵ − 3x² + 2x when x = −1?", "zh": "代入", "o": ["−4", "18", "4", "−18"], "a": 0, "e": "10 − 4 − 5 − 3 − 2."}, {"u": 2, "t": "Add/subtract", "q": "Simplify 6m − 9 − 4m.", "zh": "化簡", "o": ["2m − 9", "10m − 9", "2m + 9", "−7m"], "a": 0, "e": "6m − 4m = 2m."}, {"u": 2, "t": "Add/subtract", "q": "Simplify 5x² − 3 − 2x² + 1.", "zh": "化簡", "o": ["3x² − 2", "7x² − 4", "3x² − 4", "3x² + 2"], "a": 0, "e": "5x² − 2x² and −3 + 1."}, {"u": 2, "t": "Add/subtract", "q": "Simplify (2x + 5) + (3x − 11).", "zh": "加法", "o": ["5x − 6", "5x + 16", "x − 6", "6x − 5"], "a": 0, "e": "2x + 3x; 5 − 11."}, {"u": 2, "t": "Add/subtract", "q": "Simplify (4x + 8) − (1 + x).", "zh": "減法", "o": ["3x + 7", "5x + 9", "3x + 9", "5x + 7"], "a": 0, "e": "4x + 8 − 1 − x."}, {"u": 2, "t": "Add/subtract", "q": "Simplify (10x² + 8x + 20) − (−x² − 3x − 5).", "zh": "減法", "o": ["11x² + 11x + 25", "9x² + 5x + 15", "11x² + 5x + 15", "9x² + 11x + 25"], "a": 0, "e": "Change every sign in the second bracket."}, {"u": 3, "t": "Expand", "q": "Expand 5(x − 5).", "zh": "展開", "o": ["5x − 25", "5x − 5", "x − 25", "5x + 25"], "a": 0, "e": "5 × x and 5 × (−5)."}, {"u": 3, "t": "Expand", "q": "Expand −2(x + 8).", "zh": "展開", "o": ["−2x − 16", "−2x + 16", "−2x + 8", "2x − 16"], "a": 0, "e": "Both terms times −2."}, {"u": 3, "t": "Expand", "q": "Expand −3y(6y − 5).", "zh": "展開", "o": ["−18y² + 15y", "−18y² − 15y", "18y² − 15y", "−18y + 15"], "a": 0, "e": "(−3y)(−5) = +15y."}, {"u": 3, "t": "Expand", "q": "Expand (x + 3)(x + 5).", "zh": "展開", "o": ["x² + 8x + 15", "x² + 15", "x² + 15x + 8", "2x + 8"], "a": 0, "e": "x² + 5x + 3x + 15."}, {"u": 3, "t": "Expand", "q": "Expand (x − 8)(x + 3).", "zh": "展開", "o": ["x² − 5x − 24", "x² + 5x − 24", "x² − 11x − 24", "x² − 24"], "a": 0, "e": "3x − 8x = −5x."}, {"u": 3, "t": "Expand", "q": "Expand (3h − 1)(h + 5).", "zh": "展開", "o": ["3h² + 14h − 5", "3h² + 16h − 5", "3h² − 5", "3h² + 14h + 5"], "a": 0, "e": "15h − h = 14h."}, {"u": 3, "t": "Expand", "q": "Expand (3m + 8)².", "zh": "展開", "o": ["9m² + 48m + 64", "9m² + 64", "3m² + 48m + 64", "9m² + 24m + 64"], "a": 0, "e": "Middle term 2 × 3m × 8."}];</script>
<script src="is-quiz.js"></script>
</body>
</html>
