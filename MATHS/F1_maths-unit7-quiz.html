<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maths Chapter 7 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="is-quiz.css">
</head>
<body>
<div class="wrap">
<section id="start">
  <p style="margin:0"><a href="./" style="color:inherit">← Maths</a> · <a href="F1_maths-unit7-study-guide.html" style="color:inherit">📘 Study guide</a></p>
  <h1>Maths Chapter 7 Quiz ➗</h1>
  <p class="sub">Percentages. Take your time. There is no timer.</p>
  <div class="card">
    <b>Choose a quiz</b>
    <div class="choose"><button class="big u1" data-set="1">Basics<small>Percent of, find the whole</small></button><button class="big u2" data-set="2">Change<small>Increase and decrease</small></button><button class="big u3" data-set="3">Profit &amp; discount<small>Profit, loss, discount</small></button><button class="big" data-set="all">Everything<small>All 22 questions</small></button></div>
    <label class="toggle"><input type="checkbox" id="zhToggle" checked> Show Chinese help words 中文提示</label>
    <label class="toggle"><input type="checkbox" id="autoRead"> Read each question aloud 🔊</label>
  </div>
</section>
<section id="quiz" class="hidden">
  <div class="top"><span id="count">Question 1 of 10</span><span id="pts">⭐ 0</span></div>
  <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
  <div class="card">
    <span class="tag" id="topic"></span>
    <p class="qtext" id="qtext"></p>
    <p class="zh" id="qzh"></p>
    <button class="btn alt speak" id="speakBtn" type="button">🔊 Read aloud</button>
    <div class="opts" id="opts" role="group" aria-label="Answer choices"></div>
    <div id="fb" class="fb hidden" role="status" aria-live="polite"></div>
    <div class="row"><button class="btn hidden" id="nextBtn" type="button">Next question</button></div>
  </div>
</section>
<section id="end" class="hidden">
  <h1>Well done for finishing! 🎉</h1>
  <div class="card">
    <div class="stars" id="stars"></div>
    <div class="score" id="final"></div>
    <p id="msg"></p>
    <div id="reviewBox"></div>
    <div class="row">
      <button class="btn" id="retryWrong" type="button">Try my wrong ones again</button>
      <button class="btn alt" id="again" type="button">Start again</button>
      <button class="btn alt" id="home" type="button">Choose another quiz</button>
    </div>
  </div>
</section>
</div>
<script>window.QUIZ=[{"u": 1, "t": "Basics", "q": "75% of 96 = ?", "zh": "百分數", "o": ["72", "24", "75", "128"], "a": 0, "e": "0.75 × 96."}, {"u": 1, "t": "Basics", "q": "12% of 750 mL = ?", "zh": "百分數", "o": ["90 mL", "62.5 mL", "9 mL", "900 mL"], "a": 0, "e": "0.12 × 750."}, {"u": 1, "t": "Basics", "q": "8% of p is 4. p = ?", "zh": "求全數", "o": ["50", "0.32", "32", "5"], "a": 0, "e": "4 ÷ 0.08."}, {"u": 1, "t": "Basics", "q": "86 cm is 43% of x cm. x = ?", "zh": "求全數", "o": ["200", "37", "43", "2"], "a": 0, "e": "86 ÷ 0.43."}, {"u": 1, "t": "Basics", "q": "What percentage of 80 is 120?", "zh": "百分比", "o": ["150%", "66.7%", "40%", "120%"], "a": 0, "e": "120 ÷ 80 × 100%."}, {"u": 1, "t": "Basics", "q": "70 teachers, 28 are male. % of female teachers?", "zh": "應用", "o": ["60%", "40%", "42%", "28%"], "a": 0, "e": "42 ÷ 70."}, {"u": 1, "t": "Basics", "q": "Mary is 150 cm. Peter is 20% taller. Peter is…", "zh": "應用", "o": ["180 cm", "170 cm", "120 cm", "30 cm"], "a": 0, "e": "150 × 1.2."}, {"u": 1, "t": "Basics", "q": "38 questions done; 24% are undone. Total questions?", "zh": "應用", "o": ["50", "62", "47", "158"], "a": 0, "e": "38 is 76% of the total."}, {"u": 2, "t": "Change", "q": "Percentage increase when 20 is increased by 12?", "zh": "百分變化", "o": ["60%", "12%", "40%", "32%"], "a": 0, "e": "12 ÷ 20."}, {"u": 2, "t": "Change", "q": "Percentage increase from 80 to 100?", "zh": "百分變化", "o": ["25%", "20%", "80%", "125%"], "a": 0, "e": "20 ÷ 80."}, {"u": 2, "t": "Change", "q": "Percentage change from 180 to 117?", "zh": "百分變化", "o": ["−35%", "−63%", "35%", "−54%"], "a": 0, "e": "−63 ÷ 180."}, {"u": 2, "t": "Change", "q": "Percentage change from 36 to 27?", "zh": "百分變化", "o": ["−25%", "−33.3%", "25%", "−9%"], "a": 0, "e": "−9 ÷ 36."}, {"u": 2, "t": "Change", "q": "$25 increased by 12% is…", "zh": "新值", "o": ["$28", "$37", "$22", "$30"], "a": 0, "e": "25 × 1.12."}, {"u": 2, "t": "Change", "q": "240 reduced by 35% is…", "zh": "新值", "o": ["156", "84", "205", "275"], "a": 0, "e": "240 × 0.65."}, {"u": 2, "t": "Change", "q": "Reduced by 30% to $840. Original value?", "zh": "原值", "o": ["$1200", "$1092", "$588", "$870"], "a": 0, "e": "840 ÷ 0.7."}, {"u": 3, "t": "Profit", "q": "Cost $150, sold for $195. Profit percent?", "zh": "盈利百分率", "o": ["30%", "45%", "23%", "77%"], "a": 0, "e": "45 ÷ 150."}, {"u": 3, "t": "Profit", "q": "Cost $300, sold for $195. Loss percent?", "zh": "虧蝕百分率", "o": ["35%", "65%", "105%", "54%"], "a": 0, "e": "105 ÷ 300."}, {"u": 3, "t": "Profit", "q": "Cost $80, sold at 35% profit. Selling price?", "zh": "售價", "o": ["$108", "$115", "$52", "$28"], "a": 0, "e": "80 × 1.35."}, {"u": 3, "t": "Profit", "q": "Cost $700, sold at a loss of 38%. Selling price?", "zh": "售價", "o": ["$434", "$266", "$662", "$966"], "a": 0, "e": "700 × 0.62."}, {"u": 3, "t": "Discount", "q": "Marked $120, 15% discount. Selling price?", "zh": "折扣", "o": ["$102", "$18", "$105", "$138"], "a": 0, "e": "120 × 0.85."}, {"u": 3, "t": "Discount", "q": "Marked $780, discount $234. Discount percent?", "zh": "折扣百分率", "o": ["30%", "23.4%", "70%", "33%"], "a": 0, "e": "234 ÷ 780."}, {"u": 3, "t": "Profit", "q": "Sold for $150 at a 20% profit. Cost price?", "zh": "成本", "o": ["$125", "$120", "$180", "$130"], "a": 0, "e": "150 ÷ 1.2."}];</script>
<script src="is-quiz.js"></script>
</body>
</html>
