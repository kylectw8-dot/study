<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maths Chapter 10 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="is-quiz.css">
</head>
<body>
<div class="wrap">
<section id="start">
  <p style="margin:0"><a href="./" style="color:inherit">← Maths</a> · <a href="F1_maths-unit10-study-guide.html" style="color:inherit">📘 Study guide</a></p>
  <h1>Maths Chapter 10 Quiz ➗</h1>
  <p class="sub">Introduction to Coordinates. Take your time. There is no timer.</p>
  <div class="card">
    <b>Choose a quiz</b>
    <div class="choose"><button class="big u1" data-set="1">Coordinates<small>Points and quadrants</small></button><button class="big u2" data-set="2">Distance &amp; area<small>Lengths and areas</small></button><button class="big u3" data-set="3">Transformations<small>Translate, reflect, rotate</small></button><button class="big" data-set="all">Everything<small>All 19 questions</small></button></div>
    <label class="toggle"><input type="checkbox" id="zhToggle" checked> Show Chinese help words 中文提示</label>
    <label class="toggle"><input type="checkbox" id="autoRead"> Read each question aloud 🔊</label>
  </div>
</section>
<section id="quiz" class="hidden">
  <div class="top"><span id="count">Question 1 of 10</span><span id="pts">⭐ 0</span></div>
  <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
  <div class="card">
    <span class="tag" id="topic"></span>
    <p class="qtext" id="qtext"></p>
    <p class="zh" id="qzh"></p>
    <button class="btn alt speak" id="speakBtn" type="button">🔊 Read aloud</button>
    <div class="opts" id="opts" role="group" aria-label="Answer choices"></div>
    <div id="fb" class="fb hidden" role="status" aria-live="polite"></div>
    <div class="row"><button class="btn hidden" id="nextBtn" type="button">Next question</button></div>
  </div>
</section>
<section id="end" class="hidden">
  <h1>Well done for finishing! 🎉</h1>
  <div class="card">
    <div class="stars" id="stars"></div>
    <div class="score" id="final"></div>
    <p id="msg"></p>
    <div id="reviewBox"></div>
    <div class="row">
      <button class="btn" id="retryWrong" type="button">Try my wrong ones again</button>
      <button class="btn alt" id="again" type="button">Start again</button>
      <button class="btn alt" id="home" type="button">Choose another quiz</button>
    </div>
  </div>
</section>
</div>
<script>window.QUIZ=[{"u": 1, "t": "Coordinates", "q": "The x-coordinate of (−8, 4) is…", "zh": "x 坐標", "o": ["−8", "4", "8", "−4"], "a": 0, "e": "The first number."}, {"u": 1, "t": "Coordinates", "q": "The y-coordinate of (7, −18) is…", "zh": "y 坐標", "o": ["−18", "7", "18", "−7"], "a": 0, "e": "The second number."}, {"u": 1, "t": "Coordinates", "q": "Which point lies on the x-axis?", "zh": "x 軸", "o": ["(−8, 0)", "(0, −5)", "(2, 3)", "(1, 1)"], "a": 0, "e": "y = 0 on the x-axis."}, {"u": 1, "t": "Coordinates", "q": "Which point lies on the y-axis?", "zh": "y 軸", "o": ["(0, 6)", "(4, 0)", "(3, 4)", "(−2, 5)"], "a": 0, "e": "x = 0 on the y-axis."}, {"u": 1, "t": "Coordinates", "q": "(2, −1) lies in quadrant…", "zh": "象限", "o": ["IV", "I", "II", "III"], "a": 0, "e": "(+, −)."}, {"u": 1, "t": "Coordinates", "q": "(−4, 3) lies in quadrant…", "zh": "象限", "o": ["II", "I", "III", "IV"], "a": 0, "e": "(−, +)."}, {"u": 1, "t": "Coordinates", "q": "(3, 4) lies in quadrant…", "zh": "象限", "o": ["I", "II", "III", "IV"], "a": 0, "e": "(+, +)."}, {"u": 2, "t": "Distance", "q": "Length of AB, A(2, 7), B(11, 7)?", "zh": "距離", "o": ["9", "13", "4", "18"], "a": 0, "e": "11 − 2."}, {"u": 2, "t": "Distance", "q": "Length of CD, C(7, 4), D(7, −8)?", "zh": "距離", "o": ["12", "4", "−4", "15"], "a": 0, "e": "4 − (−8)."}, {"u": 2, "t": "Distance", "q": "A(a, 6), B(8, 6), AB = 15, A left of B. a = ?", "zh": "距離", "o": ["−7", "23", "7", "−23"], "a": 0, "e": "8 − 15."}, {"u": 2, "t": "Area", "q": "Area of △ABC, A(−3, 3), B(−3, −8), C(15, −8)?", "zh": "面積", "o": ["99", "198", "108", "49.5"], "a": 0, "e": "½ × 18 × 11."}, {"u": 2, "t": "Area", "q": "Area of △ABC, A(−1, 3), B(−1, −5), C(5, −5)?", "zh": "面積", "o": ["24", "48", "15", "30"], "a": 0, "e": "½ × 6 × 8."}, {"u": 3, "t": "Transform", "q": "A(6, 3) translated rightwards by 5 units becomes…", "zh": "平移", "o": ["(11, 3)", "(6, 8)", "(1, 3)", "(6, −2)"], "a": 0, "e": "Add 5 to x."}, {"u": 3, "t": "Transform", "q": "B(7, 7) translated downwards by 3 units becomes…", "zh": "平移", "o": ["(7, 4)", "(4, 7)", "(7, 10)", "(10, 7)"], "a": 0, "e": "Subtract 3 from y."}, {"u": 3, "t": "Transform", "q": "C(6, 5) reflected in the x-axis becomes…", "zh": "反射", "o": ["(6, −5)", "(−6, 5)", "(−6, −5)", "(5, 6)"], "a": 0, "e": "Change the sign of y."}, {"u": 3, "t": "Transform", "q": "D(3, 3) reflected in the y-axis becomes…", "zh": "反射", "o": ["(−3, 3)", "(3, −3)", "(−3, −3)", "(3, 3)"], "a": 0, "e": "Change the sign of x."}, {"u": 3, "t": "Transform", "q": "P(4, 5) rotated 90° anti-clockwise about O becomes…", "zh": "旋轉", "o": ["(−5, 4)", "(5, −4)", "(−4, −5)", "(4, −5)"], "a": 0, "e": "(x, y) → (−y, x)."}, {"u": 3, "t": "Transform", "q": "Q(4, 4) rotated 90° clockwise about O becomes…", "zh": "旋轉", "o": ["(4, −4)", "(−4, 4)", "(−4, −4)", "(4, 4)"], "a": 0, "e": "(x, y) → (y, −x)."}, {"u": 3, "t": "Transform", "q": "Q(2, 1) rotated 180° about O becomes…", "zh": "旋轉", "o": ["(−2, −1)", "(1, 2)", "(−1, 2)", "(2, −1)"], "a": 0, "e": "(x, y) → (−x, −y)."}];</script>
<script src="is-quiz.js"></script>
</body>
</html>
