<script>window.QUIZ=[{"u": 1, "t": "3.2 Causes", "q": "A landslide is the rapid movement of soil or rocks down a slope due to…", "zh": "山泥傾瀉", "o": ["gravity", "wind", "tides", "sunlight"], "a": 0, "e": "Gravity pulls the loose materials downhill."}, {"u": 1, "t": "3.2 Causes", "q": "When soil pores fill with water, the slope becomes…", "zh": "土壤孔隙充滿水", "o": ["unstable", "stronger", "drier", "flatter"], "a": 0, "e": "Water reduces the strength of slope materials."}, {"u": 1, "t": "3.2 Causes", "q": "Waterlogged soil is most common in…", "zh": "哪個季節", "o": ["summer", "winter"], "a": 0, "e": "Hong Kong’s summer is the rainy season."}, {"u": 1, "t": "3.2 Causes", "q": "What is the FIRST step of weathering?", "zh": "風化第一步", "o": ["Rainwater seeps into the rocks", "Thick layers of loose materials form", "Rocks break into small pieces", "Joints widen"], "a": 0, "e": "Order: seep in → joints widen → rocks break → loose layers form."}, {"u": 1, "t": "3.2 Causes", "q": "What is the LAST step of weathering?", "zh": "風化最後一步", "o": ["Thick layers of loose materials are formed", "Rainwater seeps into rocks", "Joints are widened", "Rocks break down"], "a": 0, "e": "Weathering ends with thick loose layers on slopes."}, {"u": 1, "t": "3.2 Causes", "q": "About what percentage of HK’s natural slopes are steeper than 20°?", "zh": "斜坡角度", "o": ["60%", "20%", "5%", "100%"], "a": 0, "e": "40% (21–30°) + 20% (31–45°) = 60%."}, {"u": 1, "t": "3.2 Causes", "q": "Slopes with larger slope angles have a ______ risk of landslides.", "zh": "斜坡越陡", "o": ["higher", "lower", "zero"], "a": 0, "e": "Steeper slopes slide more easily."}, {"u": 1, "t": "3.2 Causes", "q": "Cut-and-fill slopes were made to provide land for…", "zh": "削土填土", "o": ["buildings and roads", "farming only", "reservoirs only", "beaches"], "a": 0, "e": "Hong Kong has little flat land."}, {"u": 1, "t": "3.2 Causes", "q": "Why did early man-made slopes cause many landslides?", "zh": "早期人造斜坡", "o": ["They were steep and some were poorly constructed", "They were flat", "They had too many trees", "They were made of steel"], "a": 0, "e": "Steep angles plus poor construction or maintenance."}, {"u": 2, "t": "3.3 Impacts", "q": "Which is an impact of landslides?", "zh": "影響", "o": ["Disruption of road transport", "Triggering earthquakes", "Causing drought", "Making slopes gentler"], "a": 0, "e": "Debris blocks roads."}, {"u": 2, "t": "3.3 Impacts", "q": "Which is NOT an impact of landslides?", "zh": "哪項不是影響？", "o": ["Triggering of earthquakes", "Loss of lives", "Damage of electricity poles", "Disruption of road transport"], "a": 0, "e": "Landslides do not cause earthquakes."}, {"u": 2, "t": "3.3 Impacts", "q": "The 1972 Po Shan Road landslide…", "zh": "寶珊道", "o": ["was one of the most fatal and caused buildings to collapse", "happened in Kowloon", "caused no damage", "happened in winter drought"], "a": 0, "e": "Answer D: (2) and (3) only. It was on Hong Kong Island."}, {"u": 3, "t": "3.4 Measures", "q": "Soil nails and retaining walls help slopes by…", "zh": "泥釘和護土牆", "o": ["providing physical support", "trapping fallen materials", "issuing warnings", "clearing squatters"], "a": 0, "e": "They hold the slope in place."}, {"u": 3, "t": "3.4 Measures", "q": "Rigid and flexible barriers help by…", "zh": "屏障", "o": ["trapping fallen slope materials", "providing drainage", "adding soil", "warning people"], "a": 0, "e": "They catch rocks and mud before they reach roads."}, {"u": 3, "t": "3.4 Measures", "q": "Which engineering work improves slope drainage?", "zh": "改善排水", "o": ["Horizontal drains", "Flexible barriers", "Soil nails", "Billboards"], "a": 0, "e": "Surface drainage channels and horizontal drains remove water."}, {"u": 3, "t": "3.4 Measures", "q": "Which are land use planning measures?", "zh": "土地規劃", "o": ["Clear squatter areas and conduct risk assessments", "Regular slope maintenance only", "Send rescue teams", "Open shelters"], "a": 0, "e": "Answer C: (1) and (3) only."}, {"u": 3, "t": "3.4 Measures", "q": "Which is a PREVENTIVE measure?", "zh": "預防措施", "o": ["Issue a Landslip Warning", "Send rescue teams to the site", "Open temporary shelters", "Clear debris after the landslide"], "a": 0, "e": "Prevention happens before a landslide."}, {"u": 3, "t": "3.4 Measures", "q": "Holding exhibitions about slope safety is a…", "zh": "斜坡安全展覽", "o": ["preventive measure (public education)", "rescue measure", "engineering work", "land use conflict"], "a": 0, "e": "It teaches people what to do."}, {"u": 3, "t": "3.4 Measures", "q": "Planting on slopes is called…", "zh": "種植", "o": ["greening of slopes", "shotcreting", "soil nailing", "sedimentation"], "a": 0, "e": "Green slopes look natural and roots hold soil."}, {"u": 3, "t": "3.4 Measures", "q": "One advantage of greening slopes is…", "zh": "斜坡綠化的好處", "o": ["it looks more natural and beautiful", "it makes slopes steeper", "it causes more landslides", "it costs nothing to maintain"], "a": 0, "e": "It improves the scenery and plant roots help hold the soil."}];</script>
