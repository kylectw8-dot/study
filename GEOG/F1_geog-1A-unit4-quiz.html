或錯", "o": ["False", "True"], "a": 0, "e": "False. Bright lights at night can disturb sleep."}, {"u": 1, "t": "4.1 Pollution", "q": "True or false: Noise pollution is serious in central business districts.", "zh": "對或錯", "o": ["True", "False"], "a": 0, "e": "True. Heavy traffic and crowds are noisy."}, {"u": 1, "t": "4.1 Pollution", "q": "Solid waste in Hong Kong is mainly disposed of at…", "zh": "固體廢物處理", "o": ["landfills", "the CBD", "parks", "reservoirs"], "a": 0, "e": "Hong Kong has three landfills in the New Territories."}, {"u": 1, "t": "4.1 Pollution", "q": "Which is NOT a characteristic of Hong Kong’s landfills?", "zh": "堆填區", "o": ["Located at urban centres", "Soon to be full", "Space-consuming"], "a": 0, "e": "Landfills are in the New Territories, away from urban centres."}, {"u": 1, "t": "4.1 Housing", "q": "A long waiting time for public housing shows…", "zh": "輪候公屋時間長", "o": ["housing shortage", "too many empty flats", "low rents", "urban decay only"], "a": 0, "e": "There are not enough flats for people who need them."}, {"u": 1, "t": "4.1 Housing", "q": "Which are characteristics of subdivided flats?", "zh": "劏房的特徵", "o": ["Small living space and lack of maintenance", "Large living space", "Highest rents and large space", "Brand new buildings"], "a": 0, "e": "Answer C: (2) and (3) only."}, {"u": 2, "t": "4.2 Urban decay", "q": "Old urban areas are areas of a city that were developed…", "zh": "舊市區", "o": ["the earliest", "most recently", "never", "only for factories"], "a": 0, "e": "They are the oldest built-up areas."}, {"u": 2, "t": "4.2 Urban decay", "q": "In Hong Kong, old urban areas are mainly on both sides of…", "zh": "兩岸", "o": ["Victoria Harbour", "Tolo Harbour", "Shing Mun River", "Deep Bay"], "a": 0, "e": "E.g. Sheung Wan, Sai Ying Pun, Mong Kok, Sham Shui Po."}, {"u": 2, "t": "4.2 Urban decay", "q": "Which is NOT an old urban area?", "zh": "哪個不是舊市區？", "o": ["Ma On Shan", "Sai Ying Pun", "Tai Kok Tsui", "To Kwa Wan"], "a": 0, "e": "Ma On Shan
