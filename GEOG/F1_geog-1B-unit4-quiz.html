<script>window.QUIZ=[{"u": 1, "t": "4.1 Structure", "q": "Earth is made up of three layers. They are the…", "zh": "地球的三層", "o": ["crust, mantle and core", "crust, ocean and sky", "soil, rock and water", "plate, fault and focus"], "a": 0, "e": "Crust (outside), mantle (middle), core (centre)."}, {"u": 1, "t": "4.1 Structure", "q": "Which is the thinnest layer of Earth?", "zh": "最薄的一層", "o": ["Crust", "Mantle", "Core"], "a": 0, "e": "The crust is like the skin of an apple."}, {"u": 1, "t": "4.1 Structure", "q": "Which statement is NOT correct?", "zh": "哪項不正確？", "o": ["Oceanic crust is thicker than continental crust", "The crust is the thinnest layer", "The mantle is cooler than the core", "The inner core is solid"], "a": 0, "e": "Oceanic crust is thinner."}, {"u": 1, "t": "4.1 Structure", "q": "Hong Kong is located on the…", "zh": "香港位於", "o": ["Eurasian Plate", "Pacific Plate", "African Plate", "Antarctic Plate"], "a": 0, "e": "Hong Kong is on the Eurasian Plate."}, {"u": 1, "t": "4.1 Structure", "q": "The Eurasian Plate is mainly ______, while the Pacific Plate is mainly ______.", "zh": "板塊分別", "o": ["continental, oceanic", "oceanic, continental", "liquid, solid", "hot, cold"], "a": 0, "e": "Most of the Pacific Plate is under the ocean."}, {"u": 1, "t": "4.1 Structure", "q": "Which is one of the seven major plates?", "zh": "七大板塊", "o": ["Indo-Australian Plate", "Hong Kong Plate", "Arctic Plate", "Atlantic Plate"], "a": 0, "e": "Seven: Eurasian, Indo-Australian, Pacific, North American, South American, African, Antarctic."}, {"u": 2, "t": "4.2 Movement", "q": "Plate movement is driven by ______ currents in the mantle.", "zh": "板塊移動的動力", "o": ["convection", "ocean", "wind", "electric"], "a": 0, "e": "Hot mantle material rises and cooler material sinks."}, {"u": 2, "t": "4.2 Movement", "q": "Plates moving APART is called…", "zh": "板塊分離", "o": ["divergent", "convergent", "transform"], "a": 0, "e": "Divergent = diverge = go apart."}, {"u": 2, "t": "4.2 Movement", "q": "Plates moving TOWARDS each other is called…", "zh": "板塊聚合", "o": ["convergent", "divergent", "transform"], "a": 0, "e": "Convergent = come together."}, {"u": 2, "t": "4.2 Movement", "q": "Plates SLIDING PAST each other is called…", "zh": "板塊錯動", "o": ["transform", "divergent", "convergent"], "a": 0, "e": "They move side by side in opposite directions."}, {"u": 2, "t": "4.2 Movement", "q": "The point underground where rocks break is the…", "zh": "震源", "o": ["focus", "epicentre", "fault line on the map", "crust"], "a": 0, "e": "The focus is underground."}, {"u": 2, "t": "4.2 Movement", "q": "The point on the surface directly above the focus is the…", "zh": "震央", "o": ["epicentre", "focus", "core", "mantle"], "a": 0, "e": "Shaking is usually strongest at the epicentre."}, {"u": 2, "t": "4.2 Movement", "q": "What happens FIRST in the formation of an earthquake?", "zh": "地震形成第一步", "o": ["Pressure builds up along the plate boundary as plates move", "The earth shakes", "Rocks break and move", "Seismic waves are released"], "a": 0, "e": "Pressure builds, exceeds limits, rocks break, energy is released, the earth shakes."}, {"u": 2, "t": "4.2 Movement", "q": "After rocks break and move, the stored energy is released as…", "zh": "能量釋放", "o": ["seismic waves", "light", "rain", "convection currents"], "a": 0, "e": "Seismic waves make the ground shake."}, {"u": 3, "t": "4.3 Impacts", "q": "Most earthquakes occur along…", "zh": "大部分地震發生在", "o": ["plate boundaries", "the middle of plates", "the North Pole", "river banks"], "a": 0, "e": "Plates meet at boundaries, where pressure builds."}, {"u": 3, "t": "4.3 Impacts", "q": "The Pacific Ring of Fire is also called the…", "zh": "太平洋火環", "o": ["Circum-Pacific Belt", "Alpine-Himalayan Belt", "Tropic of Cancer", "Equator"], "a": 0, "e": "Most of the world’s earthquakes happen there."}, {"u": 3, "t": "4.3 Impacts", "q": "Which earthquake zone stretches across Europe and Asia?", "zh": "跨越歐亞", "o": ["Alpine-Himalayan Belt", "Circum-Pacific
