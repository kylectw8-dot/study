igger", "To make them green"], "a": 0, "e": "Iodine stains the nucleus so it shows up."}, {"u": 2, "t": "4.2 Cells", "q": "A cover slip prevents onion cells from…", "zh": "蓋玻片", "o": ["drying out", "growing", "turning green", "moving"], "a": 0, "e": "It also keeps the sample flat."}, {"u": 2, "t": "4.2 Cells", "q": "When drawing cells, you should…", "zh": "畫細胞圖", "o": ["use clear pencil lines and no shading", "shade the nucleus darkly", "cross the label lines", "use a pen"], "a": 0, "e": "Clear lines, no shading, straight label lines that do not cross."}, {"u": 2, "t": "4.2 Cells", "q": "Which statement about cells is correct?", "zh": "哪項正確？", "o": ["All living things are made up of cells", "Cells are flat", "All cells have a cell wall", "All cells are round"], "a": 0, "e": "Cells are 3-D and come in many shapes."}, {"u": 3, "t": "4.3 Reproduction", "q": "The male sex cell is the…", "zh": "男性性細胞", "o": ["sperm", "egg", "ovary", "chromosome"], "a": 0, "e": "Sperm is small with a tail and can swim."}, {"u": 3, "t": "4.3 Reproduction", "q": "Compare sperm and egg sizes.", "zh": "比較大小", "o": ["Sperm is smaller than the egg", "Sperm is larger than the egg", "They are the same size"], "a": 0, "e": "The egg is about 100 micrometres; the sperm is much smaller."}, {"u": 3, "t": "4.3 Reproduction", "q": "During puberty, the level of ______ in the body increases.", "zh": "青春期", "o": ["sex hormones", "oxygen", "iodine", "chlorophyll"], "a": 0, "e": "Sex hormones cause secondary sexual characteristics."}, {"u": 3, "t": "4.3 Reproduction", "q": "Which is NOT a secondary sexual characteristic in males?", "zh": "哪項不是男性第二性徵？", "o": ["Production of semen", "Growth of beard", "Widening of shoulders", "Larynx becoming larger"], "a": 0, "e": "Semen production is a reproductive function, not a secondary sexual characteristic."}, {"u": 3, "t": "4.6 Heredity", "q": "Passing on traits from one generation to the next is…", "zh": "遺傳", "o": ["heredity", "puberty", "excretion", "photosynthesis"], "a": 0, "e": "Heredity happens because genetic information in DNA is passed on."}, {"u": 3, "t": "4.6 Heredity", "q": "How many chromosomes are in a human body cell?", "zh": "體細胞染色體數目", "o": ["46", "23", "12", "92"], "a": 0, "e": "46 in a body cell. 23 in a sex cell."}, {"u": 3, "t": "4.6 Heredity", "q": "How many chromosomes are in a human sex cell?", "zh": "性細胞染色體數目", "o": ["23", "46", "2", "100"], "a": 0, "e": "Sex cells have half: 23."}];</script>
